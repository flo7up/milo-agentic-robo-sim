<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milo Run Replay</title>
<script>(()=>{const param=new URLSearchParams(location.search).get('scoutTheme');document.documentElement.setAttribute('data-theme',param||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));})();</script>
<style>
:root{color-scheme:light;--cp-bg:#f7f4ef;--cp-bg-elevated:#fcfbf8;--cp-surface:#ffffff;--cp-surface-soft:#f5f5f5;--cp-border:#dedede;--cp-border-strong:#919191;--cp-text:#242424;--cp-text-muted:#5c5c5c;--cp-text-soft:#6f6f6f;--cp-accent:#b11f4b;--cp-accent-hover:#9a1a41;--cp-accent-soft:rgba(177,31,75,.08);--cp-accent-fg:#ffffff;--cp-success:#16a34a;--cp-danger:#dc2626;--cp-warning:#f59e0b;--cp-link:#0078d4;--cp-shadow:0 18px 48px rgba(0,0,0,.12);--cp-overlay:rgba(255,255,255,.8);--cp-panel:rgba(255,255,255,.86);--cp-panel-strong:rgba(255,255,255,.96);--cp-sheen:rgba(255,255,255,.55);--cp-highlight:rgba(177,31,75,.12)}
html[data-theme=dark]{color-scheme:dark;--cp-bg:#3d3b3a;--cp-bg-elevated:#343231;--cp-surface:#292929;--cp-surface-soft:#2e2e2e;--cp-border:#474747;--cp-border-strong:#5f5f5f;--cp-text:#dedede;--cp-text-muted:#919191;--cp-text-soft:#b0b0b0;--cp-accent:#fd8ea1;--cp-accent-hover:#fb7b91;--cp-accent-soft:rgba(253,142,161,.14);--cp-accent-fg:#1a1a1a;--cp-success:#4ade80;--cp-danger:#f87171;--cp-warning:#fbbf24;--cp-link:#4da6ff;--cp-shadow:0 18px 48px rgba(0,0,0,.32);--cp-overlay:rgba(41,41,41,.88);--cp-panel:rgba(41,41,41,.72);--cp-panel-strong:rgba(41,41,41,.96);--cp-sheen:rgba(255,255,255,.04);--cp-highlight:rgba(253,142,161,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--cp-bg);color:var(--cp-text);font:15px 'Segoe UI',Aptos,Calibri,sans-serif;letter-spacing:0}main{max-width:1280px;margin:auto;padding:24px}header{border-bottom:1px solid var(--cp-border);padding-bottom:16px}h1{font-size:26px;margin:4px 0}h2{font-size:17px;margin:0 0 12px}.muted,dt{color:var(--cp-text-muted)}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding:20px 0}dl{margin:0}dd{margin:6px 0;font:22px Consolas,monospace}.views{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}figure{margin:0;min-width:0}figcaption{margin:8px 0}.images{display:grid;grid-template-columns:1fr 1fr;gap:12px}canvas{display:block;width:100%;background:var(--cp-surface);border:1px solid var(--cp-border);aspect-ratio:1.25}img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--cp-surface-soft);border:1px solid var(--cp-border)}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid var(--cp-border)}button,select{font:inherit;padding:8px 12px;border:1px solid var(--cp-border-strong);border-radius:4px;background:var(--cp-surface);color:var(--cp-text);cursor:pointer}input[type=range]{flex:1;min-width:160px;accent-color:var(--cp-accent)}output{font-family:Consolas,monospace;min-width:125px}.detail{margin-top:20px;overflow-wrap:anywhere;min-height:80px}.legend{display:flex;gap:18px;flex-wrap:wrap}.actual{color:var(--cp-accent)}.planned{color:var(--cp-link)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--cp-border)}.scroll{overflow:auto;max-height:220px}#warning{color:var(--cp-danger)}@media(max-width:700px){main{padding:16px}.views{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.images{grid-template-columns:1fr 1fr}h1{font-size:22px}.controls{gap:8px}output{min-width:100px}}
</style></head><body><main>
<header><div class="muted">Milo / Privileged evaluation replay</div><h1 id="title">Run replay</h1><div id="outcome"></div><p id="warning"></p></header>
<section class="metrics" aria-label="Run scorecard"><dl><dt>Verified completion</dt><dd id="completion"></dd></dl><dl><dt>Elapsed wall time</dt><dd id="elapsed"></dd></dl><dl><dt>Actual travel</dt><dd id="distance"></dd></dl><dl><dt>Stationary inference</dt><dd id="waiting"></dd></dl><dl><dt>Contact episodes</dt><dd id="contacts"></dd></dl></section>
<section class="views"><figure><canvas id="path" width="800" height="640" aria-label="Actual and planned robot paths"></canvas><figcaption class="legend"><span class="actual">Actual physics trajectory</span><span class="planned">Planned local route</span><span class="muted">Coordinates in meters</span></figcaption></figure>
<div><h2>Camera Timeline</h2><figure><img id="camera" alt="Recorded robot head camera"><figcaption id="cameraTime"></figcaption></figure><div class="images"><figure><img id="rgb" alt="Recorded paired RGB"><figcaption>Paired RGB</figcaption></figure><figure><img id="depth" alt="Recorded paired metric depth"><figcaption id="depthTime">Metric depth</figcaption></figure></div></div></section>
<div class="controls"><button id="play" type="button">Play recording</button><button id="reset" type="button">Restart</button><input id="time" aria-label="Replay time" type="range" min="0" step="0.05" value="0"><output id="clock"></output><label>Speed <select id="speed"><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option><option value="10">10x</option></select></label></div>
<section class="detail" aria-live="polite"><h2 id="activity"></h2><div id="reason"></div><p id="velocity" class="muted"></p></section>
<section><h2>Stationary Intervals</h2><div class="scroll"><table><thead><tr><th>Start</th><th>Duration</th><th>Recorded state</th></tr></thead><tbody id="stops"></tbody></table></div></section>
</main><script type="application/json" id="data">__RECORDING_DATA__</script><script>
const recording=JSON.parse(document.getElementById('data').textContent),samples=recording.samples,score=recording.score;
const element=id=>document.getElementById(id),format=value=>Number(value).toFixed(2),end=score.elapsed_wall_s;
element('title').textContent=recording.manifest.label||recording.manifest.challenge||'Run replay';
element('outcome').textContent=(recording.manifest.real_model?'Real-model attempt':'Scripted reference / no autonomy claim')+' / '+(score.final_physics_success?'Final physics checks passed':'Final physics checks not satisfied');
element('warning').textContent=score.complete_recording?'':`Incomplete recording: ${score.dropped_records} dropped records`;
element('completion').textContent=score.completion_time_s===null?'Not completed':format(score.completion_time_s)+' s';
element('elapsed').textContent=format(end)+' s';element('distance').textContent=format(score.actual_distance_m)+' m';element('waiting').textContent=format(score.inference_stationary_s)+' s';element('contacts').textContent=score.contact_episodes;
element('time').max=end;
for(const stop of score.stationary_intervals){const row=document.createElement('tr');for(const text of [format(stop.start_s)+' s',format(stop.duration_s)+' s',stop.reason]){const cell=document.createElement('td');cell.textContent=text;row.append(cell)}element('stops').append(row)}
const canvas=element('path'),context=canvas.getContext('2d'),origin=samples[0],bounds=samples.reduce((area,sample)=>[Math.min(area[0],sample.position_m[0]),Math.min(area[1],sample.position_m[1]),Math.max(area[2],sample.position_m[0]),Math.max(area[3],sample.position_m[1])],[Infinity,Infinity,-Infinity,-Infinity]);
const span=Math.max(2,bounds[2]-bounds[0]+1,bounds[3]-bounds[1]+1),center=[(bounds[0]+bounds[2])/2,(bounds[1]+bounds[3])/2],scale=560/span;
const point=position=>[400+(position[0]-center[0])*scale,320-(position[1]-center[1])*scale];
function line(points,color){context.strokeStyle=color;context.lineWidth=3;context.beginPath();points.forEach((position,index)=>{const [horizontal,vertical]=point(position);if(index===0)context.moveTo(horizontal,vertical);else context.lineTo(horizontal,vertical)});context.stroke()}
function image(id,path){const image=element(id);if(!path){image.removeAttribute('src');return}if(image.getAttribute('src')!==path)image.src=path;image.onerror=()=>{image.alt='Recorded image unavailable'}}
function render(time){if(!samples.length)return;let lower=0,upper=samples.length-1;while(lower<upper){const middle=Math.ceil((lower+upper)/2);if(samples[middle].wall_s<=time)lower=middle;else upper=middle-1}const sample=samples[lower],style=getComputedStyle(canvas);context.clearRect(0,0,800,640);line(samples.map(entry=>entry.position_m),style.getPropertyValue('--cp-border'));line(samples.slice(0,lower+1).map(entry=>entry.position_m),style.getPropertyValue('--cp-accent'));const angle=origin.yaw_rad-origin.odometry_m_rad[2];const planned=sample.path_odometry_m.map(position=>{const forward=position[0]-origin.odometry_m_rad[0],left=position[1]-origin.odometry_m_rad[1];return [origin.position_m[0]+forward*Math.cos(angle)-left*Math.sin(angle),origin.position_m[1]+forward*Math.sin(angle)+left*Math.cos(angle)]});line(planned,style.getPropertyValue('--cp-link'));const [horizontal,vertical]=point(sample.position_m);context.fillStyle=style.getPropertyValue('--cp-text');context.beginPath();context.arc(horizontal,vertical,7,0,2*Math.PI);context.fill();line([sample.position_m,[sample.position_m[0]+.25*Math.cos(sample.yaw_rad),sample.position_m[1]+.25*Math.sin(sample.yaw_rad)]],style.getPropertyValue('--cp-text'));element('clock').textContent=format(time)+' / '+format(end)+' s';element('activity').textContent=sample.activity; element('reason').textContent=sample.reason||'No active motion command';element('velocity').textContent=`Measured: ${format(sample.linear_speed_mps)} m/s / ${format(sample.angular_speed_radps)} rad/s / Physics: ${format(sample.simulated_s)} s`;image('camera',sample.camera?.path);image('rgb',sample.spatial?.rgb);image('depth',sample.spatial?.depth);element('cameraTime').textContent=sample.camera?`Camera ${sample.camera.sequence} / physics ${format(sample.camera.simulated_s)} s`:'No camera sample';element('depthTime').textContent=sample.spatial?`Depth ${sample.spatial.sequence} / physics ${format(sample.spatial.simulated_s)} s`:'No depth sample';}
let playing=false,last=0;function pause(){playing=false;element('play').textContent='Play recording'}element('play').onclick=()=>{playing=!playing;element('play').textContent=playing?'Pause':'Play recording';last=performance.now()};element('reset').onclick=()=>{pause();element('time').value=0;render(0)};element('time').oninput=()=>{pause();render(Number(element('time').value))};function tick(now){if(playing){const time=Math.min(end,Number(element('time').value)+(now-last)/1000*Number(element('speed').value));element('time').value=time;render(time);if(time>=end)pause()}last=now;requestAnimationFrame(tick)}render(0);requestAnimationFrame(tick);
</script></body></html>
