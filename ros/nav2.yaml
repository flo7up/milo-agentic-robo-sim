controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    failure_tolerance: 1.0
    progress_checker:
      required_movement_radius: 0.05
      movement_time_allowance: 15.0
    general_goal_checker:
      xy_goal_tolerance: 0.025
      yaw_goal_tolerance: 0.06
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.35
      lookahead_dist: 0.3
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.5
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 1.0
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.5
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      regulated_linear_scaling_min_speed: 0.03
      use_rotate_to_heading: true
      allow_reversing: false
      transform_tolerance: 0.3
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    GridBased:
      allow_unknown: false
      tolerance: 0.05
      use_astar: true
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      initial_transform_timeout: 60.0
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      robot_radius: 0.6
      footprint_padding: 0.03
      plugins: [obstacle_layer, voxel_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /laser/points
          data_type: PointCloud2
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 7.5
          raytrace_max_range: 8.0
          observation_persistence: 0.0
          expected_update_rate: 0.5
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.8
        mark_threshold: 0
        observation_sources: head
        head:
          topic: /head/points
          data_type: PointCloud2
          min_obstacle_height: 0.04
          max_obstacle_height: 0.8
          marking: true
          clearing: true
          obstacle_max_range: 7.5
          raytrace_max_range: 8.0
          observation_persistence: 0.0
          expected_update_rate: 0.5
      inflation_layer:
        inflation_radius: 0.65
        cost_scaling_factor: 5.0
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: odom
      initial_transform_timeout: 60.0
      robot_base_frame: base_link
      rolling_window: true
      width: 16
      height: 16
      resolution: 0.05
      robot_radius: 0.6
      footprint_padding: 0.03
      track_unknown_space: true
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /laser/points
          data_type: PointCloud2
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 7.5
          raytrace_max_range: 8.0
          observation_persistence: 0.0
          expected_update_rate: 0.5
      inflation_layer:
        inflation_radius: 0.65
        cost_scaling_factor: 5.0
bt_navigator:
  ros__parameters:
    global_frame: odom
behavior_server:
  ros__parameters:
    global_frame: odom
    enable_stamped_cmd_vel: true
    robot_base_frame: base_link
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0
velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 10.0
    max_velocity: [0.35, 0.0, 0.5]
    min_velocity: [-0.35, 0.0, -0.5]
    max_accel: [0.3, 0.0, 1.0]
    max_decel: [-0.3, 0.0, -1.0]
    velocity_timeout: 0.3
collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame_id: base_link
    source_timeout: 0.5
    observation_sources: [scan, head]
    head:
      type: pointcloud
      topic: /head/points
      min_height: 0.04
      max_height: 0.8
      enabled: true
    FootprintApproach:
      min_points: 1
      time_before_collision: 1.5